</head><body><a class="skip" href="#main">Skip to content</a><header class="site-head"><a class="brand" href="dashboard.html"><span class="brand-avatar"><img src="assets/turtle/turtle-static.png" alt=""></span><span><strong><span class="green-text">Turtle</span> Study Buddy</strong><small>Your learning space</small></span></a><nav class="workspace-nav"><a class="nav-link " href="dashboard.html">Dashboard</a><a class="nav-link " href="chat.html">Chat</a><a class="nav-link " href="classroom.html">Classroom</a><a class="nav-link " href="voice.html">Voice</a></nav><div class="head-right"><a class="profile-chip" href="profile.html"><img data-profile-avatar src="assets/turtle/turtle-static.png" alt=""><span data-profile-name>Learner</span></a></div></header><main id="main" class="workspace"><div class="focus-grid"><section class="panel focus-main"><span class="eyebrow">GO STUDY TIME</span><h1>Set one goal. Focus on it.</h1><div class="focus-setup"><label>Subject<select id="focusSubject"><option>Math</option><option>Science</option><option>English</option><option>Computer Science</option><option>History</option><option>Geography</option><option>Languages</option><option>Exam Prep</option></select></label><label>Goal<input id="focusGoal" maxlength="120" placeholder="Example: finish 10 algebra questions"></label><div class="time-picks"><button class="time-pick" data-minutes="15" type="button">15 min</button><button class="time-pick selected" data-minutes="25" type="button">25 min</button><button class="time-pick" data-minutes="45" type="button">45 min</button><button class="time-pick" data-minutes="60" type="button">60 min</button></div></div><div class="clock-circle" id="timerRing"><div class="clock-inner"><b id="timerValue">25:00</b><span>focus time</span></div></div><div class="focus-actions"><button class="btn btn-green" id="focusStart" type="button">Start</button><button class="btn btn-light" id="focusFinish" type="button">Finish & save</button></div><p class="focus-status" id="focusStatus">25-minute study block ready.</p></section><aside class="panel focus-side"><h2>Recent focus</h2><div id="focusHistory"></div></aside></div></main><script type="module" src="assets/js/focus.js"></script></body></html>
