    <a class="brand" href="dashboard.html"><img src="favicon.png" alt=""><span class="brand-word"><b>Turtle</b><small>STUDY BUDDY</small></span></a>

<main id="main">
<div class="app-shell"><aside class="sidebar"><div class="side-title">Workspace</div><a class="side-link" href="dashboard.html">🏠 Dashboard</a><a class="side-link" href="chat.html">💬 Chat</a><a class="side-link" href="classroom.html">🧑‍🏫 Classroom</a><a class="side-link" href="voice.html">🎙️ Voice</a><a class="side-link" href="focus.html">⏱️ Go Study Time</a><div class="side-title">Account</div><a class="side-link active" href="profile.html">👤 My Profile</a></aside><section class="app-main"><div class="app-title"><div><h1>My Profile</h1><p>Only the study preferences needed for guest mode are stored on this device.</p></div></div>
<div class="profile-grid"><section class="panel profile-summary"><div class="avatar">🐢</div><h2 id="profileName">Guest</h2><p id="profileMeta">13-15 · Math</p><button class="btn btn-secondary" id="resetProfile" type="button">Reset guest data</button></section>
<section class="panel"><form class="form-grid" id="profileForm"><div class="field"><label for="nickname">Nickname</label><input id="nickname" maxlength="24" required></div><div class="field"><label for="age">Age band</label><select id="age"><option>10-12</option><option>13-15</option><option>16-17</option><option>18+</option></select></div><div class="field"><label for="subject">Favourite subject</label><select id="subject"><option>Math</option><option>Science</option><option>English</option><option>Computer Science</option><option>History</option><option>Geography</option><option>Languages</option><option>Exam Prep</option></select></div><div class="field"><label for="style">Explanation style</label><select id="style"><option>Step by step</option><option>Short and direct</option><option>Examples first</option><option>Visual explanation</option></select></div><div><button class="btn btn-primary" type="submit">Save changes</button> <span id="saved"></span></div></form></section></div></section></div>
</main>

<script type="module" src="assets/js/site.js"></script>
<script type="module" src="assets/js/profile.js"></script>
